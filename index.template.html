<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<meta name="robots" content="noindex"/>
<title>실버스테이 지도 프레임</title>
<!--
  실버스테이 지도 프레임 (DR-62)

  ⚠️ 이 페이지가 **부모 사이트와 다른 오리진**에 있는 것이 핵심이다.
     silverstay.co.kr 안에서 sandbox srcdoc 으로 지도를 띄우면 iframe 이 opaque origin 이 되어
     나가는 요청에 Referer 가 실리지 않는다. 그러면 ① OSM 은 차단 이미지를 HTTP 200 으로 주고
     ② 네이버·카카오·VWorld 는 도메인 검증에 실패한다. 반대로 같은 오리진에서 sandbox 를 풀면
     지도 코드가 부모 localStorage 의 Supabase 세션(=관리자 세션)에 닿는다.
     별도 오리진이면 둘 다 해결된다 — 여기는 진짜 origin 이라 도메인 검증을 통과하고,
     부모와 다른 origin 이라 세션에는 못 닿는다.

  ⚠️ 부모는 이 프레임을 반드시 **src=<이 URL>** 로 띄워야 한다. srcdoc 으로 인라인하면
     allow-same-origin 이 **부모 오리진**을 물려줘(HTML 명세 origin 결정 3단계) 정확히
     막으려던 것이 열린다. src → srcdoc 되돌리기는 그 자체로 보안 사고다.

  ⚠️ 이 파일은 생성물이다. 원본은 map-frame/index.template.html —
     배포 스크립트가 __NAVER_KEY__ 를 치환한다. index.html 을 직접 고치지 말 것.
-->
<style>
  html, body { height: 100%; margin: 0; background: #F7F8FA;
    font-family: Pretendard, 'Malgun Gothic', sans-serif; }
  #map { position: absolute; inset: 0; }
  #diag { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #465059; font-size: 14px; line-height: 1.7;
    background: #F7F8FA; }
  #diag.show { display: flex; }
  #diag b { display: block; font-size: 15px; margin-bottom: 8px; color: #B42318; }
  #diag code { display: block; margin-top: 6px; font-size: 12px; color: #6B7280; word-break: break-all; }
</style>
</head>
<body>
<div id="map"></div>
<div id="diag"><div id="diagText"></div></div>
<script>
(function () {
  'use strict';

  // 부모로 인정할 오리진. 이 페이지는 공개 URL 이라 **누구나 자기 사이트에 끼워 넣을 수 있다** —
  // 그 경우 지도는 보여도 우리 데이터는 흐르지 않게 한다.
  var ALLOWED_PARENTS = ['https://silverstay.co.kr', 'http://localhost:8081', 'http://127.0.0.1:8081'];

  var diag = document.getElementById('diag');
  var diagText = document.getElementById('diagText');
  function parentOrigin() {
    try { return document.referrer ? new URL(document.referrer).origin : ''; } catch (e) { return ''; }
  }
  function post(msg) {
    // ⚠️ targetOrigin 을 '*' 로 쓰지 않는다 — 남의 페이지에 박혀 있으면 그쪽으로 새어 나간다.
    var o = parentOrigin();
    if (ALLOWED_PARENTS.indexOf(o) < 0) return;
    try { parent.postMessage(msg, o); } catch (e) { /* noop */ }
  }
  function fail(title, detail) {
    diagText.innerHTML = '<b>' + title + '</b><code>' + detail + '</code>';
    diag.className = 'show';
    post({ type: 'error', title: title, detail: detail });
  }

  // ⚠️ 네이버 v3 는 인증 실패를 **이 전역 함수**로 알린다. 스크립트 자체는 도메인과 무관하게
  //    200 으로 내려온다(실측 333KB). 여기까지 와야 도메인 등록 여부를 알 수 있다.
  window.navermap_authFailure = function () {
    fail('지도 인증 실패', '이 도메인(' + location.origin + ')이 네이버 클라우드 콘솔의 Web 서비스 URL 에 등록되지 않았습니다.');
  };

  var KEY = '__NAVER_KEY__';
  if (!KEY || KEY.indexOf('__') === 0) { fail('지도 키 없음', '배포 시 키가 치환되지 않았습니다.'); return; }

  var s = document.createElement('script');
  s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(KEY);
  s.onerror = function () { fail('SDK 로드 실패', s.src); };
  s.onload = function () {
    if (!window.naver || !window.naver.maps) { fail('SDK 초기화 실패', 'naver.maps 가 없습니다.'); return; }
    var map = new naver.maps.Map('map', {
      center: new naver.maps.LatLng(36.5, 127.8),
      zoom: 7,
      mapDataControl: false,
      logoControl: true,   // ⚠️ 네이버 로고는 약관상 가리지 않는다
      scaleControl: true
    });
    window.__map = map;
    post({ type: 'ready', origin: location.origin });
    // 인증 실패가 비동기로 판정되는 경우가 있다 — 타일이 한 장도 안 붙으면 그것으로 판정한다.
    setTimeout(function () {
      var tiles = document.querySelectorAll('#map img').length;
      post({ type: 'tiles', count: tiles });
      if (tiles === 0) fail('타일 없음', '지도 객체는 만들어졌는데 타일이 0장입니다 — 도메인 검증 실패로 의심됩니다.');
      else { document.title = '지도 정상 · 타일 ' + tiles + '장'; }
    }, 4000);
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>

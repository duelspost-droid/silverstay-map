<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<meta name="robots" content="noindex"/>
<title>실버스테이 지도 프레임</title>
<!--
  실버스테이 지도 프레임 (DR-62)

  ⚠️ 이 페이지가 **부모 사이트와 다른 오리진**에 있는 것이 이 구조의 전부다.
     silverstay.co.kr 안에서 sandbox srcdoc 으로 지도를 띄우면 iframe 이 opaque origin 이 되고,
     나가는 요청에 Referer 가 실리지 않는다. 그러면 ① OSM 은 차단 이미지를 HTTP 200 으로 주고
     ② 네이버·카카오는 도메인 검증에 실패한다. 반대로 같은 오리진에서 sandbox 를 풀면 지도
     코드가 부모 localStorage 의 Supabase 세션(=관리자 세션)에 닿는다.
     별도 오리진이면 둘 다 해결된다 — 진짜 origin 이라 검증을 통과하고, 세션에는 못 닿는다.

  ⚠️ 부모는 이 프레임을 반드시 **src=<이 URL>** 로 띄운다. srcdoc 으로 인라인하면
     allow-same-origin 이 **부모 오리진**을 물려줘(HTML 명세 origin 결정 3단계) 막으려던 것이 열린다.

  ⚠️ 이 파일은 생성물이다. 원본은 map-frame/index.template.html (배포가 rng0yufszb 를 치환).

  제공자: 기본 **네이버 지도**(NCP Maps, Dynamic Map 월 600만 회 무료).
  ⚠️ 인증 실패·로드 실패 시 **OSM(Leaflet)으로 자동 폴백**한다. 한 제공자에만 걸면 그쪽이
     조용히 죽을 때 지도가 통째로 사라진다 — 2026-09-25 에 실제로 그렇게 됐다.
     강제 전환: ?provider=leaflet / ?provider=naver (폴백 경로를 실제로 시험해 볼 수 있어야 한다).
-->
<link rel="stylesheet" href="vendor/leaflet.css"/>
<link rel="stylesheet" href="vendor/MarkerCluster.css"/>
<link rel="stylesheet" href="vendor/MarkerCluster.Default.css"/>
<style>
  html, body, #map { height: 100%; margin: 0; font-family: Pretendard, 'Malgun Gothic', sans-serif; }
  /* ⚠️ 색은 부모 앱 lib/theme.ts 의 값을 **손으로 옮긴 사본**이다. 프레임은 별도 오리진 정적 HTML 이라
     theme.ts 를 import 할 수 없다. theme 를 바꾸면 여기도 같이 바꿀 것 — scripts/tests/mapFilters.test.ts 가 대조한다.
       #0F7560 = colors.brandText(라이트) = colors.brand(brand-600). 흰 글자 5.62:1.
       예전 #0E8C72(규정 원색)는 흰 글자 4.19:1 로 AA 미달이라 핀·클러스터 면에서 뺐다(패키지 §2-3).
       #FAF9F7 = colors.bg · #5F5B54 = colors.muted · #6B665D = colors.subtle · #191F28 = colors.text */
  body { background: #FAF9F7; }
  /* 시설 핀 11px 은 패키지 §3-4 '지도 배지 예외'(12px 미만 허용 범위) — 핀이 커지면 서로 겹친다 */
  .pin { position: absolute; left: 0; top: 0; transform: translate(-50%,-100%); white-space: nowrap;
    font-weight: 800; font-size: 11px; line-height: 1; padding: 5px 9px; border-radius: 13px;
    border: 1.6px solid #fff; box-shadow: 0 2px 5px rgba(28,25,20,.3); cursor: pointer;
    font-variant-numeric: tabular-nums }
  .pin::after { content: ''; position: absolute; left: 50%; top: 100%; margin-left: -4px; border: 4px solid transparent }
  .pin.priced { background: #0F7560; color: #fff } .pin.priced::after { border-top-color: #0F7560 }
  .pin.plain { background: #465059; color: #fff } .pin.plain::after { border-top-color: #465059 }

  /* ── 클러스터(패키지 §4-5, DR-69) ─────────────────────────────────────
     · 지름 5단계 34/42/50/58/66px(개수 구간은 아래 CLUSTER_BANDS 주석) · 화면 폭의 약 8% 를 넘지 않게 압축
     · 면 #096E5A(brand-700, 흰 글자 6.20:1 — 패키지 §4-5 원문) + opacity .94 + 흰 테두리 2px — 아래 지도 라벨('경기도' 등)이 비쳐 보이게
     · 숫자 13px 이상, tabular-nums
     · 보이는 원과 누르는 영역을 나눈다: .sc-hit 는 최소 48×48(토큰 --tap-min), .sc 가 보이는 원 */
  .sc-hit { display: flex; align-items: center; justify-content: center; background: transparent; cursor: pointer;
    border-radius: 50% }
  .sc { display: flex; align-items: center; justify-content: center; box-sizing: border-box; border-radius: 50%;
    background: #096E5A; color: #fff; opacity: .94; border: 2px solid #fff; font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    box-shadow: 0 2px 4px rgba(28,25,20,.06), 0 6px 16px rgba(28,25,20,.07);
    transition: transform 160ms cubic-bezier(.2,0,0,1) }
  .sc-hit:hover .sc { transform: scale(1.06) }
  /* 키보드 포커스 링 — Leaflet 은 바깥 .leaflet-marker-icon 이 포커스를 받는다(outline:none 금지) */
  .leaflet-marker-icon:focus-visible, .sc-hit:focus-visible { outline: 3px solid #0F7560; outline-offset: 2px }
  @media (prefers-reduced-motion: reduce) { .sc { transition: none } .sc-hit:hover .sc { transform: none } }
  .me { width: 18px; height: 18px; border-radius: 50%; background: #2A7FFF; border: 3px solid #fff;
    box-shadow: 0 0 0 4px rgba(42,127,255,.3) }
  .lp { font-size: 13px; line-height: 1.5; padding: 10px 12px; min-width: 150px }
  .lp b { font-size: 14px }
  .lp a { color: #0F7560; font-weight: 700; text-decoration: underline; display: inline-block; padding: 6px 0 }
  .lp .mm { color: #0F7560; font-weight: 700; font-size: 12px }
  .lp .meta { color: #5F5B54 }
  .lp .ref { color: #6B665D; font-size: 12px }
  #diag { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #465059; font-size: 13px; line-height: 1.7;
    background: #F7F8FA; z-index: 9999 }
  #diag.show { display: flex }
  #diag b { display: block; font-size: 15px; margin-bottom: 8px; color: #B42318 }
</style>
</head>
<body>
<div id="map"></div>
<div id="diag"><div id="diagText"></div></div>
<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet.markercluster.js"></script>
<!-- ⚠️ vendor/marker-clustering.js 는 여기서 읽지 않는다 — 로드 시점에
     naver.maps.Util.ClassExtend 를 호출하므로 SDK 보다 먼저 읽히면 ReferenceError 로 죽는다.
     initNaver 가 SDK 로드 성공 뒤에 동적으로 읽는다. -->
<script>
(function () {
  'use strict';

  var BUILD = 'naver-5'; // DR-69 클러스터 5단계·색 토큰 — 프레임을 고쳤는데 그대로면 ready.build 부터 확인
  var NAVER_KEY = 'rng0yufszb';
  var TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
  var TILE_ATTRIB = '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors';

  // 이 페이지는 공개 URL 이라 누구나 자기 사이트에 끼워 넣을 수 있다.
  // 그 경우 지도는 보여도 우리 데이터는 흐르지 않고, 우리도 그쪽으로 메시지를 보내지 않는다.
  var ALLOWED_PARENTS = ['https://silverstay.co.kr', 'http://localhost:8081', 'http://127.0.0.1:8081'];
  function parentOrigin() {
    try { return document.referrer ? new URL(document.referrer).origin : ''; } catch (e) { return ''; }
  }
  var PARENT = parentOrigin();
  var TRUSTED = ALLOWED_PARENTS.indexOf(PARENT) >= 0;
  function post(msg) {
    // targetOrigin 에 '*' 를 쓰지 않는다 — 남의 페이지에 박혀 있으면 그쪽으로 새어 나간다
    // (예전 부모 코드가 사용자의 현재 위치 좌표를 '*' 로 보내고 있었다).
    if (!TRUSTED) return;
    try { parent.postMessage(msg, PARENT); } catch (e) { /* noop */ }
  }
  function fail(title, detail) {
    document.getElementById('diagText').innerHTML = '<b>' + title + '</b>' + detail;
    document.getElementById('diag').className = 'show';
    post({ type: 'error', title: title, detail: detail });
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  // onclick="__sel('…')" 는 HTML 속성 → JS 문자열 2단 컨텍스트다. esc() 로는 못 막는다
  // (속성 값이 JS 파싱 전에 HTML 디코딩되어 &#39; 가 ' 로 되살아난다). uuid 문자만 남긴다.
  function uuidOnly(s) { return String(s == null ? '' : s).replace(/[^0-9a-fA-F-]/g, '').slice(0, 36); }
  window.__sel = function (id) { post({ type: 'facility', id: uuidOnly(id) }); };

  function fmtMonthly(v) {
    if (!v) return '';
    if (v >= 100000000) return '월 ' + (Math.round(v / 10000000) / 10) + '억';
    return '월 ' + Math.round(v / 10000) + '만원';
  }
  function pinHtml(f) {
    var priced = !!f.mm;
    return '<div class="pin ' + (priced ? 'priced' : 'plain') + '">'
      + esc(priced ? fmtMonthly(f.mm) : (f.cat || '시설')) + '</div>';
  }
  function popupHtml(f) {
    var mm = fmtMonthly(f.mm);
    return '<div class="lp"><b>' + esc(f.name) + '</b><br>'
      + '<span class="meta">' + (f.cat ? esc(f.cat) + ' · ' : '') + esc(f.region) + '</span>'
      + (mm ? '<br><span class="mm">' + mm + '~</span> <span class="ref">참고가</span>'
        // 장기요양 추정(오너 결정 2026-10-20) — 공표가가 아니라 물결·'참고가' 없이, 무엇을 더했는지 함께.
        //   급여분 본인부담만이다 — 안내를 빼면 실제보다 싸 보인다. 글자는 앱이 보낸 ln(카드와 같은 ltcCardRange().note).
        //   옛 앱(ln 없음)이면 같은 뜻의 기본 문구.
        : f.lt ? '<br><span class="mm">' + esc(f.lt) + '</span><br><span class="ref">장기요양 추정 · '
          + esc(f.ln || '일반 본인부담 기준, 식비 등 비급여는 별도') + '</span>'
        // 분양형(오너 지시 2026-10-20 '분양형은 분양형으로') — 관리비를 금액으로 그리지 않는다. 옛 앱은 ow 를 안 보내 이 줄이 없다.
        : f.ow ? '<br><span class="meta">분양형</span> <span class="ref">비용 구조 다름</span>' : '')
      + '<br><a href="#" onclick="window.__sel(&#39;' + uuidOnly(f.id) + '&#39;);return false;">상세 보기 &rsaquo;</a></div>';
  }

  // ── 클러스터 크기(패키지 §4-5) ─────────────────────────────────────
  // 개수 구간 4경계 → 5단계. 실제 마커 분포(2026-10-19 anon 조회, 좌표 보유 6,730곳)로 정했다:
  //   · 전국 줌(7)에서 클러스터는 2~2,231곳, 중앙값 ≈350 → 200·1,000 경계가 '수도권 덩어리(1,000+)'와
  //     '도 단위(200~999)'를 가른다.
  //   · 시·군 줌(10)에서는 중앙값 ≈7, 상위 10% ≈42 → 10·50 경계가 '동네(10 미만)'와 '읍·구(10~49)'를 가른다.
  //   · 분류를 좁히면(실버타운 49곳) 가장 큰 클러스터도 24곳이라 아래 두 단계에만 머문다 —
  //     작은 분류가 큰 원으로 부풀어 보이지 않는다.
  //   경계가 대략 ×4~5 간격(로그 눈금)이라 줌을 바꿔도 단계가 고르게 쓰인다. 예전 네이버 경계 [10,50,200,1000] 과 같다.
  // ⚠️ app 쪽 시험(scripts/tests/mapFilters.test.ts)이 이 두 배열을 읽어 대조한다 — 형식을 바꾸지 말 것.
  var CLUSTER_BANDS = [10, 50, 200, 1000];
  var CLUSTER_SIZES = [34, 42, 50, 58, 66];
  var TAP_MIN = 48;
  function bandOf(n) { var i = 0; while (i < CLUSTER_BANDS.length && n >= CLUSTER_BANDS[i]) i++; return i; }
  // 지름 상한 = 지도 폭의 8%(패키지: '최대 8%'). 단, 42px 아래로는 줄이지 않는다 —
  // 375px 폰에서 8% 는 30px 이라 네 자리 숫자(13px)가 원에 들어가지 않고 5단계 구분도 사라진다.
  // 상한이 66 보다 작으면 34~66 을 34~상한 사이로 **비례 압축**해 단계 차이를 남긴다.
  //   375px → 34/36/38/40/42 · 768px → 34/41/48/54/61 · 825px 이상 → 34/42/50/58/66
  function clusterCap() {
    var el = document.getElementById('map');
    var w = (el && el.clientWidth) || window.innerWidth || 0;
    return Math.max(42, Math.min(66, Math.round(w * 0.08)));
  }
  function clusterSize(band, cap) {
    var s = CLUSTER_SIZES[band];
    return Math.round(34 + (s - 34) * (cap - 34) / (66 - 34));
  }
  function clusterFont(size) { return size >= 58 ? 16 : size >= 50 ? 14 : 13; }  // 숫자 13px 이상
  function clusterHtml(size, countText) {
    var hit = Math.max(TAP_MIN, size);
    var label = countText ? ' role="img" aria-label="시설 ' + countText + '곳 묶음 — 누르면 확대"' : '';
    return '<div class="sc-hit"' + label + ' style="width:' + hit + 'px;height:' + hit + 'px">'
      + '<div class="sc" style="width:' + size + 'px;height:' + size + 'px;font-size:' + clusterFont(size) + 'px">'
      + '<span>' + countText + '</span></div></div>';
  }
  var lastCap = 0;  // 지도 폭이 바뀌어 상한이 달라지면 클러스터 아이콘을 다시 만든다(refit 참조)

  // ── 공통 상태 ────────────────────────────────────────────────────
  var facs = [], curCat = null, provider = null;
  var userMoved = false, fitting = false, lastFitW = 0, lastFitH = 0;
  var impl = null; // { render, locate, single, resize, size, view, restyle }

  function boundsOf(cat) {
    var minLat = 90, maxLat = -90, minLng = 180, maxLng = -180, n = 0;
    for (var i = 0; i < facs.length; i++) {
      var f = facs[i];
      if (cat && f.k !== cat) continue;
      if (f.lat < minLat) minLat = f.lat;
      if (f.lat > maxLat) maxLat = f.lat;
      if (f.lng < minLng) minLng = f.lng;
      if (f.lng > maxLng) maxLng = f.lng;
      n++;
    }
    return n && minLat <= maxLat ? { minLat: minLat, maxLat: maxLat, minLng: minLng, maxLng: maxLng, n: n } : null;
  }

  function reportRendered(shown) {
    var v = impl.view();
    post({ type: 'rendered', provider: provider, shown: shown, center: v.center, zoom: v.zoom, size: v.size });
  }

  // 컨테이너 크기가 늦게 확정되는 경우(모바일 주소창, 부모 레이아웃 전환)를 모두 잡는다.
  // ⚠️ 크기 0 에서 렌더되면 시야 계산이 불가능하다 — 크기가 생기는 순간 다시 맞춘다.
  //    단, 사용자가 이미 움직였으면 건드리지 않는다(보던 위치를 빼앗지 않는다).
  function refit() {
    if (!impl) return;
    impl.resize();
    // 크기 0 에서 처음 그려졌거나(상한 42 로 고정) 화면 회전·창 크기 변경으로 폭이 바뀌면 원 크기를 다시 계산한다.
    var cap = clusterCap();
    if (cap !== lastCap) { lastCap = cap; if (impl.restyle) impl.restyle(); }
    var s = impl.size();
    if (!userMoved && facs.length && s[0] > 0 && s[1] > 0 && (lastFitW === 0 || lastFitH === 0)) {
      impl.fit(curCat);
      var v = impl.view();
      post({ type: 'refit', size: v.size, zoom: v.zoom, center: v.center });
    }
  }
  window.addEventListener('resize', refit);
  window.addEventListener('orientationchange', refit);
  setTimeout(refit, 150); setTimeout(refit, 600); setTimeout(refit, 1500);
  if (window.ResizeObserver) { try { new ResizeObserver(refit).observe(document.body); } catch (e) { /* noop */ } }

  // ── 네이버 구현 ──────────────────────────────────────────────────
  function initNaver(cb) {
    if (!NAVER_KEY || NAVER_KEY.indexOf('__') === 0) { cb(new Error('키 없음')); return; }
    var done = false;
    // ⚠️ 인증 실패는 이 전역 훅으로만 온다. 스크립트 자체는 도메인과 무관하게 200 으로 내려오고
    //    (실측 333KB), 지도 객체도 만들어진다 — 여기까지 와야 등록 여부를 알 수 있다.
    window.navermap_authFailure = function () {
      if (done) { fail('지도 인증 실패', 'NCP 콘솔의 Web 서비스 URL 에 ' + location.origin + ' 등록을 확인하세요.'); return; }
      done = true; cb(new Error('authFailure'));
    };
    var s = document.createElement('script');
    s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(NAVER_KEY);
    s.onerror = function () { if (!done) { done = true; cb(new Error('SDK 로드 실패')); } };
    s.onload = function () {
      if (done) return;
      if (!window.naver || !window.naver.maps) { done = true; cb(new Error('naver.maps 없음')); return; }
      // ⚠️ 클러스터링 라이브러리는 **SDK 로드 뒤에** 읽어야 한다(로드 시점에 naver.maps 를 쓴다).
      //    실패해도 지도는 떠야 하므로 onerror 에서도 계속 진행한다 — 그 경우 마커가 낱개로 찍힌다.
      var c = document.createElement('script');
      c.src = 'vendor/marker-clustering.js';
      c.onload = function () { buildMap(); };
      c.onerror = function () { post({ type: 'warn', detail: '클러스터링 라이브러리 로드 실패 — 마커를 낱개로 표시합니다' }); buildMap(); };
      document.head.appendChild(c);
      return;

      function buildMap() {
      var map = new naver.maps.Map('map', {
        center: new naver.maps.LatLng(36.5, 127.8), zoom: 7,
        mapDataControl: false, scaleControl: true, logoControl: true, // ⚠️ 로고는 약관상 가린다
      });
      naver.maps.Event.addListener(map, 'dragstart', function () { if (!fitting) userMoved = true; });
      naver.maps.Event.addListener(map, 'zoom_start', function () { if (!fitting) userMoved = true; });
      var markers = [], cluster = null, meMarker = null, info = null;
      // 클러스터 아이콘 5장 — 숫자는 stylingFunction 이 클러스터마다 채운다(아이콘 HTML 은 공유된다).
      function naverIcons(cap) {
        var out = [];
        for (var b = 0; b < CLUSTER_SIZES.length; b++) {
          var size = clusterSize(b, cap), hit = Math.max(TAP_MIN, size);
          out.push({ content: clusterHtml(size, ''), size: new naver.maps.Size(hit, hit), anchor: new naver.maps.Point(hit / 2, hit / 2) });
        }
        return out;
      }
      // ⚠️ 매번 **새 함수**를 돌려준다 — restyle 에서 같은 함수를 다시 넣으면 KVO 가 바뀐 줄 몰라 숫자를 다시 안 쓴다.
      function naverStyling() {
        return function (cm, count) {
          var root = cm.getElement && cm.getElement();
          var el = root && root.querySelector('span');
          if (el) el.innerText = String(count);
          var hitEl = root && root.querySelector('.sc-hit');
          if (hitEl) { hitEl.setAttribute('role', 'img'); hitEl.setAttribute('aria-label', '시설 ' + count + '곳 묶음 — 누르면 확대'); }
        };
      }
      function clear() {
        markers.forEach(function (m) { m.setMap(null); });
        markers = [];
        if (cluster) { cluster.setMap(null); cluster = null; }
      }
      impl = {
        size: function () { var s2 = map.getSize(); return [s2.width, s2.height]; },
        view: function () {
          var c = map.getCenter(), s2 = map.getSize();
          return { center: [Number(c.lat().toFixed(4)), Number(c.lng().toFixed(4))], zoom: map.getZoom(), size: [s2.width, s2.height] };
        },
        resize: function () { try { naver.maps.Event.trigger(map, 'resize'); } catch (e) { /* noop */ } },
        // icons 를 먼저, 숫자 채우는 함수를 나중에 — 아이콘이 바뀌면 숫자 칸이 비므로 순서가 중요하다.
        restyle: function () { if (cluster) { cluster.setIcons(naverIcons(lastCap)); cluster.setStylingFunction(naverStyling()); } },
        fit: function (cat) {
          var b = boundsOf(cat); if (!b) return;
          fitting = true;
          map.fitBounds(new naver.maps.LatLngBounds(
            new naver.maps.LatLng(b.minLat, b.minLng), new naver.maps.LatLng(b.maxLat, b.maxLng)));
          var s2 = map.getSize(); lastFitW = s2.width; lastFitH = s2.height;
          setTimeout(function () { fitting = false; }, 400);
        },
        render: function (cat) {
          clear();
          var shown = 0;
          for (var i = 0; i < facs.length; i++) {
            var f = facs[i];
            if (cat && f.k !== cat) continue;
            var mk = new naver.maps.Marker({
              position: new naver.maps.LatLng(f.lat, f.lng),
              icon: { content: pinHtml(f), anchor: new naver.maps.Point(0, 0) },
            });
            (function (fac, marker) {
              naver.maps.Event.addListener(marker, 'click', function () {
                if (info) info.close();
                info = new naver.maps.InfoWindow({ content: popupHtml(fac), borderWidth: 0, disableAnchor: false });
                info.open(map, marker);
              });
            })(f, mk);
            markers.push(mk); shown++;
          }
          var MC = window.MarkerClustering;
          if (MC && markers.length) {
            lastCap = clusterCap();
            cluster = new MC({
              map: map, markers: markers, disableClickZoom: false, minClusterSize: 2, maxZoom: 13, gridSize: 120,
              indexGenerator: CLUSTER_BANDS.slice(),
              icons: naverIcons(lastCap),
              stylingFunction: naverStyling(),
            });
          } else {
            markers.forEach(function (m) { m.setMap(map); });
          }
          if (shown) impl.fit(cat);
          return shown;
        },
        locate: function (lat, lng) {
          if (meMarker) meMarker.setMap(null);
          meMarker = new naver.maps.Marker({ position: new naver.maps.LatLng(lat, lng), map: map, zIndex: 1000,
            icon: { content: '<div class="me"></div>', anchor: new naver.maps.Point(9, 9) } });
          map.setCenter(new naver.maps.LatLng(lat, lng)); map.setZoom(14);
        },
        single: function (d) {
          map.setOptions('scrollWheel', d.scrollWheelZoom !== false);
          impl.resize();
          var ll = new naver.maps.LatLng(d.lat, d.lng);
          map.setCenter(ll); map.setZoom(d.approx ? 14 : 16);
          lastFitW = 1; lastFitH = 1; // 단일 지점은 재조정 대상이 아니다
          if (d.approx) {
            new naver.maps.Circle({ map: map, center: ll, radius: 200,
              strokeColor: '#0F7560', strokeWeight: 2, fillColor: '#0F7560', fillOpacity: 0.15 });
          } else {
            new naver.maps.Marker({ position: ll, map: map, icon: { content:
              '<div style="background:#0F7560;border:2px solid #fff;border-radius:50% 50% 50% 0;width:22px;height:22px;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.45)"></div>',
              anchor: new naver.maps.Point(11, 22) } });
          }
        },
      };
      done = true;
      cb(null);
      } // buildMap
    };
    document.head.appendChild(s);
  }

  // ── Leaflet(OSM) 폴백 구현 ───────────────────────────────────────
  // ⚠️ 이 경로는 장식이 아니다. 네이버가 죽으면 여기로 떨어져야 지도가 남는다.
  //    ?provider=leaflet 으로 강제 진입해 **실제로 시험할 수 있게** 해 둔다.
  function initLeaflet(cb) {
    if (!window.L) { cb(new Error('leaflet 없음')); return; }
    var map = L.map('map', { zoomControl: true, preferCanvas: true }).setView([36.5, 127.8], 7);
    L.tileLayer(TILE_URL, { maxZoom: 19, attribution: TILE_ATTRIB }).addTo(map);
    lastCap = clusterCap();
    var cluster = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 60,
      spiderfyOnMaxZoom: true, disableClusteringAtZoom: 16, showCoverageOnHover: false,
      // 기본 아이콘(.marker-cluster-small/medium/large 3단계, 옅은 반투명 원)을 5단계 브랜드 원으로 바꾼다.
      iconCreateFunction: function (c) {
        var n = c.getChildCount(), size = clusterSize(bandOf(n), lastCap), hit = Math.max(TAP_MIN, size);
        return L.divIcon({ className: '', html: clusterHtml(size, String(n)), iconSize: [hit, hit] });
      } });
    map.addLayer(cluster);
    map.on('dragstart', function () { if (!fitting) userMoved = true; });
    map.on('zoomstart', function () { if (!fitting) userMoved = true; });
    var meMarker = null;
    impl = {
      size: function () { var s = map.getSize(); return [s.x, s.y]; },
      view: function () {
        var c = map.getCenter(), s = map.getSize();
        return { center: [Number(c.lat.toFixed(4)), Number(c.lng.toFixed(4))], zoom: map.getZoom(), size: [s.x, s.y] };
      },
      resize: function () { try { map.invalidateSize(false); } catch (e) { /* noop */ } },
      restyle: function () { try { cluster.refreshClusters(); } catch (e) { /* noop */ } },
      fit: function (cat) {
        var b = boundsOf(cat); if (!b) return;
        fitting = true;
        try { map.fitBounds([[b.minLat, b.minLng], [b.maxLat, b.maxLng]], { padding: [40, 40], maxZoom: 12 }); } catch (e) { /* noop */ }
        var s = map.getSize(); lastFitW = s.x; lastFitH = s.y;
        setTimeout(function () { fitting = false; }, 400);
      },
      render: function (cat) {
        cluster.clearLayers();
        var shown = 0;
        for (var i = 0; i < facs.length; i++) {
          var f = facs[i];
          if (cat && f.k !== cat) continue;
          var m = L.marker([f.lat, f.lng], { icon: L.divIcon({ className: '', html: pinHtml(f), iconSize: [1, 1], iconAnchor: [0, 0] }) });
          m.bindPopup(popupHtml(f));
          cluster.addLayer(m); shown++;
        }
        if (shown) impl.fit(cat);
        return shown;
      },
      locate: function (lat, lng) {
        if (meMarker) map.removeLayer(meMarker);
        meMarker = L.marker([lat, lng], { zIndexOffset: 1000,
          icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }) }).addTo(map);
        map.setView([lat, lng], 13);
      },
      single: function (d) {
        if (d.scrollWheelZoom === false) map.scrollWheelZoom.disable();
        map.invalidateSize(false);
        map.setView([d.lat, d.lng], d.approx ? 14 : 15);
        lastFitW = 1; lastFitH = 1;
        var nm = String(d.name == null ? '' : d.name);
        if (d.approx) {
          L.circle([d.lat, d.lng], { radius: 200, color: '#0F7560', weight: 2, fillColor: '#0F7560', fillOpacity: .15 })
            .addTo(map).bindPopup(esc(nm) + ' (대략 위치)');
        } else {
          L.marker([d.lat, d.lng], { icon: L.divIcon({ className: '', iconSize: [22, 22], iconAnchor: [11, 22],
            html: '<div style="background:#0F7560;border:2px solid #fff;border-radius:50% 50% 50% 0;width:22px;height:22px;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.45)"></div>' }) })
            .addTo(map).bindPopup(esc(nm));
        }
      },
    };
    cb(null);
  }

  // ── 부팅 ────────────────────────────────────────────────────────
  var forced = (location.search.match(/[?&]provider=(naver|leaflet)/) || [])[1];
  var pending = null; // 준비 전에 도착한 메시지

  function ready(name) {
    provider = name;
    post({ type: 'ready', build: BUILD, provider: provider, origin: location.origin });
    if (pending) { try { handle(pending); } catch (err) { post({ type: 'error', title: '초기 메시지 처리 실패', detail: String(err && err.stack || err).slice(0, 400) }); } pending = null; }
    setTimeout(function () {
      var tiles = document.querySelectorAll('#map img').length;
      post({ type: 'tiles', provider: provider, count: tiles });
      if (tiles === 0) fail('지도 타일 없음', '타일이 한 장도 로드되지 않았습니다(' + provider + ').');
    }, 5000);
  }

  function boot() {
    if (forced === 'leaflet') { initLeaflet(function (e) { e ? fail('지도 초기화 실패', String(e.message || e)) : ready('leaflet'); }); return; }
    initNaver(function (err) {
      if (!err) { ready('naver'); return; }
      // ⚠️ 폴백. 네이버가 막혀도 지도는 남아야 한다 — 다만 조용히 넘어가지 않고 부모에 알린다.
      post({ type: 'fallback', from: 'naver', reason: String(err.message || err) });
      initLeaflet(function (e2) { e2 ? fail('지도 초기화 실패', String(e2.message || e2)) : ready('leaflet'); });
    });
  }

  function handle(d) {
    if (d.type === 'markers' && Array.isArray(d.items)) {
      facs = d.items.filter(function (f) {
        return f && typeof f.lat === 'number' && typeof f.lng === 'number' && Math.abs(f.lat) > 0.001;
      });
      curCat = d.cat || null;
      reportRendered(impl.render(curCat));
    } else if (d.type === 'filter') {
      curCat = d.cat || null;
      reportRendered(impl.render(curCat));
    } else if (d.type === 'locate' && typeof d.lat === 'number' && typeof d.lng === 'number') {
      impl.locate(d.lat, d.lng);
    } else if (d.type === 'single' && typeof d.lat === 'number' && typeof d.lng === 'number') {
      impl.single(d);
    }
  }

  window.addEventListener('message', function (e) {
    // 발신 오리진을 반드시 확인한다 — 이 프레임은 공개 URL 이라 아무나 메시지를 보낼 수 있다.
    if (ALLOWED_PARENTS.indexOf(e.origin) < 0) return;
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    if (!impl) { pending = d; return; } // 준비 전 도착분은 보관했다가 처리한다
    // ⚠️ 메시지 처리 중 예외를 **삼키지 않는다.** 삼키면 지도가 그냥 비어 보이고 원인이 안 남는다
    //    (2026-09-25: 네이버 전환 직후 마커가 안 그려졌는데 아무 신호도 없었다).
    try { handle(d); }
    catch (err) { post({ type: 'error', title: '메시지 처리 실패', detail: String(err && err.stack || err).slice(0, 400), msgType: d.type }); }
  });

  boot();
})();
</script>
</body>
</html>
